<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Project — Settimana III</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>

<body>

  <header>
    <div class="contenuto-header">
      <div class="titoli">
        <h1>Le mie Serie TV</h1>
        <p>Segna le serie che hai visto e quelle che vuoi vedere.</p>
      </div>
      <button type="button" id="tema">Tema scuro</button>
    </div>
  </header>

  <main>

    <section class="form">
      <h2>Aggiungi una serie</h2>
      <form id="form-serie" novalidate>
        <div class="campo campo-titolo">
          <label for="titolo">Titolo</label>
          <input type="text" id="titolo" placeholder="Es. Dark">
        </div>
        <div class="campo campo-creatore">
          <label for="creatore">Creatore</label>
          <input type="text" id="creatore" placeholder="Es. Baran bo Odar">
        </div>
        <div class="campo campo-anno">
          <label for="anno">Anno</label>
          <input type="number" id="anno" placeholder="2017">
        </div>
        <div class="campo campo-stato">
          <label for="stato">Stato</label>
          <select id="stato">
            <option value="da-vedere">Da vedere</option>
            <option value="visto">Visto</option>
          </select>
        </div>
        <button type="submit" id="aggiungi">Aggiungi</button>
        <p id="errore"></p>
      </form>
    </section>

    <section class="controlli">
      <input type="search" id="ricerca" placeholder="Cerca per titolo o creatore" aria-label="Cerca una serie">
      <select id="filtro" aria-label="Filtra per stato">
        <option value="tutti">Tutte</option>
        <option value="visto">Solo visti</option>
        <option value="da-vedere">Solo da vedere</option>
      </select>
      <select id="ordina" aria-label="Ordina per anno">
        <option value="anno-crescente">Anno crescente</option>
        <option value="anno-decrescente">Anno decrescente</option>
      </select>
    </section>

    <section class="statistiche">
      <div class="contatori">
        <div class="contatore">
          <span class="numero" id="num-totale">0</span>
          <span class="etichetta-stat">Totale</span>
        </div>
        <div class="contatore">
          <span class="numero" id="num-visti">0</span>
          <span class="etichetta-stat">Visti</span>
        </div>
        <div class="contatore">
          <span class="numero" id="num-da-vedere">0</span>
          <span class="etichetta-stat">Da vedere</span>
        </div>
      </div>
      <div class="barra-area">
        <div class="barra">
          <div class="barra-riempimento" id="barra-visti"></div>
        </div>
        <p id="testo-percentuale">Percentuale visti: 0%</p>
      </div>
    </section>

    <section class="lista">
      <h2>La tua collezione</h2>
      <!-- Container che render() ricostruisce a ogni cambio di stato -->
      <ul id="elenco"></ul>
      <p id="vuoto">Nessuna serie corrisponde ai criteri.</p>
    </section>

    <div id="notifica"></div>

  </main>

  <footer>
    <p>Creato da Kledjan — 2026</p>
  </footer>


</body>

</html>
